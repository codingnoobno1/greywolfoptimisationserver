{% extends "base.html" %}

{% block title %}Greywolf AI | Debug Console{% endblock %}

{% block extra_css %}
<style>
    .app-grid {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 20px;
        padding: 20px;
        flex: 1;
        overflow: hidden;
    }

    .viewport {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    .viewport-header {
        padding: 10px 20px;
        background: rgba(255,255,255,0.02);
        border-bottom: 1px solid var(--border);
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    .stream-container {
        flex: 1;
        background: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .stream-container img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .sidebar {
        display: flex;
        flex-direction: column;
        gap: 20px;
        overflow-y: auto;
    }

    .widget {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
    }

    .widget h3 {
        margin: 0 0 15px 0;
        font-size: 0.9rem;
        color: var(--text-bold);
        text-transform: uppercase;
    }

    .mode-btn {
        width: 100%;
        padding: 12px;
        margin-bottom: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #21262d;
        color: var(--text);
        cursor: pointer;
        text-align: left;
        transition: all 0.2s;
        display: flex;
        justify-content: space-between;
    }

    .mode-btn:hover { background: #30363d; }
    .mode-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(59,130,246,0.05); }

    .telemetry-log {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        background: #000;
        padding: 15px;
        border-radius: 10px;
        height: 250px;
        overflow-y: auto;
        color: #8b949e;
        border: 1px solid var(--border);
    }

    .health-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }

    .health-box {
        background: rgba(255,255,255,0.02);
        padding: 10px;
        border-radius: 8px;
        text-align: center;
    }

    .health-label { font-size: 0.7rem; opacity: 0.6; display: block; }
    .health-value { font-weight: 700; font-size: 1.1rem; color: var(--text-bold); }
</style>
{% endblock %}

{% block content %}
<div class="app-grid">
    <section class="viewport">
        <div class="viewport-header">Live Telemetry Viewport</div>
        <div class="stream-container">
            <img src="/video_feed" alt="Camera Feed">
        </div>
    </section>

    <aside class="sidebar">
        <div class="widget">
            <h3>Engine Control</h3>
            <button id="btn-none" class="mode-btn active" onclick="updateMode('none')">
                RAW FEED <span>&rarr;</span>
            </button>
            <button id="btn-yolo" class="mode-btn" onclick="updateMode('yolo')">
                YOLO v8 <span>&rarr;</span>
            </button>
            <button id="btn-mediapipe" class="mode-btn" onclick="updateMode('mediapipe')">
                MEDIAPIPE <span>&rarr;</span>
            </button>
        </div>

        <div class="widget">
            <h3>Health Metrics</h3>
            <div class="health-grid">
                <div class="health-box">
                    <span class="health-label">FPS</span>
                    <span class="health-value" id="fps-val">0.0</span>
                </div>
                <div class="health-box">
                    <span class="health-label">QUEUE</span>
                    <span class="health-value" id="queue-val">0</span>
                </div>
            </div>
        </div>

        <div class="widget" style="flex: 1; display: flex; flex-direction: column;">
            <h3>Telemetry Log</h3>
            <pre class="telemetry-log" id="telemetry-log">{}</pre>
        </div>
    </aside>
</div>
{% endblock %}

{% block extra_js %}
<script>
    async function updateMode(mode) {
        try {
            await fetch('/api/v1/greywolf/toggle?enabled=false', {method: 'POST'});
            await fetch('/api/v1/handgesture/toggle?enabled=false', {method: 'POST'});
            
            if (mode !== 'none') {
                const route = mode === 'yolo' ? 'greywolf' : 'handgesture';
                await fetch(`/api/v1/${route}/toggle?enabled=true`, {method: 'POST'});
            }
            
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
        } catch (e) {
            console.error('Mode switch failed', e);
        }
    }

    function setupWS() {
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const ws = new WebSocket(`${protocol}//${location.host}/ws`);

        ws.onopen = () => {
            document.getElementById('ws-indicator').classList.add('active');
            document.getElementById('ws-status').innerText = 'CONNECTED';
        };

        ws.onclose = () => {
            document.getElementById('ws-indicator').classList.remove('active');
            document.getElementById('ws-status').innerText = 'RECONNECTING...';
            setTimeout(setupWS, 2000);
        };

        ws.onmessage = (evt) => {
            const data = JSON.parse(evt.data);
            if (data.fps) document.getElementById('fps-val').innerText = data.fps.toFixed(1);
            document.getElementById('telemetry-log').innerText = JSON.stringify(data, null, 2);
        };
    }

    async function pollHealth() {
        try {
            const res = await fetch('/api/v1/health');
            const data = await res.json();
            document.getElementById('queue-val').innerText = data.queue_size;
        } catch (e) {}
    }

    setupWS();
    setInterval(pollHealth, 2000);
</script>
{% endblock %}
