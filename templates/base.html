<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Greywolf AI{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg: #040506;
            --panel: rgba(22, 27, 34, 0.7);
            --accent: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.3);
            --purple: #bc8cff;
            --danger: #f85149;
            --success: #3fb950;
            --text: #8b949e;
            --text-bright: #f0f6fc;
            --border: #30363d;
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% -20%, #1a2333 0%, transparent 50%);
            color: var(--text);
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.5s ease-in;
        }
        body.loaded { opacity: 1; }

        .navbar {
            padding: 0.8rem 3rem;
            background: var(--panel);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        .nav-brand { font-size: 1.6rem; font-weight: 800; color: var(--text-bright); text-decoration: none; display: flex; align-items: center; gap: 15px; letter-spacing: -1px; }
        .nav-brand i { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent-glow)); }

        .nav-links { display: flex; gap: 2.5rem; }
        .nav-link { color: var(--text); text-decoration: none; font-weight: 500; font-size: 0.95rem; transition: all 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-link:hover, .nav-link.active { color: var(--text-bright); }
        .nav-link.active { border-bottom: 2px solid var(--accent); padding-bottom: 4px; }

        .btn-premium {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-bright);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-premium.active { border-color: var(--success); color: var(--success); background: rgba(63, 185, 80, 0.1); }

        .content-area { flex: 1; padding: 2.5rem 3rem; overflow-y: auto; }

        .glass-card {
            background: var(--panel);
            backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Loader */
        .system-loader {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s, visibility 0.5s;
        }
        .loader-bar { width: 200px; height: 2px; background: var(--border); margin-top: 20px; position: relative; overflow: hidden; }
        .loader-fill { width: 0%; height: 100%; background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: load 1.5s infinite; }
        @keyframes load { from { left: -100%; } to { left: 100%; } }

        #browser-capture-video { display: none; }
    </style>
</head>
<body onload="document.body.classList.add('loaded'); document.querySelector('.system-loader').style.opacity=0; setTimeout(()=>document.querySelector('.system-loader').style.visibility='hidden', 500)">
    
    <div class="system-loader">
        <i class="fas fa-ghost fa-3x" style="color: var(--accent); animation: pulse 2s infinite;"></i>
        <div class="loader-bar"><div class="loader-fill"></div></div>
        <p style="font-size: 0.8rem; margin-top: 15px; letter-spacing: 2px; opacity: 0.5;">INITIALIZING GREYWOLF ENGINE</p>
    </div>

    <nav class="navbar">
        <a href="/" class="nav-brand"><i class="fas fa-ghost"></i> <span>GREYWOLF AI</span></a>
        <div class="nav-links">
            <a href="/" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}"><i class="fas fa-chart-line"></i> Dashboard</a>
            <a href="/yolo" class="nav-link {% if active_page == 'vision' %}active{% endif %}"><i class="fas fa-bullseye"></i> Vision</a>
            <a href="/mediapipe" class="nav-link {% if active_page == 'gestures' %}active{% endif %}"><i class="fas fa-hand-sparkles"></i> Gestures</a>
            <a href="/settings" class="nav-link {% if active_page == 'settings' %}active{% endif %}"><i class="fas fa-cog"></i> Settings</a>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button id="btn-browser-cam" class="btn-premium" onclick="toggleBrowserCam()">
                <i class="fas fa-video"></i> BROWSER CAMERA
            </button>
            <div id="ws-indicator" style="width: 10px; height: 10px; border-radius: 50%; background: var(--danger); box-shadow: 0 0 10px var(--danger);"></div>
        </div>
    </nav>

    <video id="browser-capture-video" autoplay muted playsinline></video>
    <canvas id="browser-capture-canvas" style="display: none;"></canvas>

    <main class="content-area">
        {% block content %}{% endblock %}
    </main>

    <script>
        let browserStream = null;
        let ingestWS = null;
        let captureTimer = null;

        async function toggleBrowserCam() {
            const btn = document.getElementById('btn-browser-cam');
            if (!browserStream) {
                try {
                    if (!navigator.mediaDevices) {
                        throw new Error('This browser does not support camera access in non-secure contexts. Please use HTTPS or access via localhost.');
                    }
                    browserStream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: {ideal: 640}, height: {ideal: 480}, frameRate: { ideal: 15 } } 
                    });
                    document.getElementById('browser-capture-video').srcObject = browserStream;
                    btn.classList.add('active');
                    btn.innerHTML = '<i class="fas fa-stop"></i> STOP CAMERA';
                    startIngestion();
                } catch (e) {
                    alert('Camera Access Error: ' + e.message + '\n\nNote: Camera access requires a Secure Context (HTTPS or localhost).');
                }
            } else {
                stopBrowserCam();
                btn.classList.remove('active');
                btn.innerHTML = '<i class="fas fa-video"></i> BROWSER CAMERA';
            }
        }

        function startIngestion() {
            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            // Use 'web_browser' as the unique source ID for the laptop camera
            ingestWS = new WebSocket(`${protocol}//${location.host}/api/mobile/ws/web_browser`);
            ingestWS.binaryType = 'blob'; 

            const video = document.getElementById('browser-capture-video');
            const canvas = document.getElementById('browser-capture-canvas');

            ingestWS.onopen = () => {
                captureTimer = setInterval(() => {
                    if (ingestWS.readyState === 1) {
                        canvas.width = 640; canvas.height = 480;
                        canvas.getContext('2d').drawImage(video, 0, 0, 640, 480);
                        canvas.toBlob((blob) => {
                            if (ingestWS && ingestWS.readyState === 1) ingestWS.send(blob);
                        }, 'image/jpeg', 0.5);
                    }
                }, 100);
            };
        }

        function stopBrowserCam() {
            if (browserStream) browserStream.getTracks().forEach(t => t.stop());
            browserStream = null;
            if (captureTimer) clearInterval(captureTimer);
            if (ingestWS) ingestWS.close();
        }

        let telemetryWS = null;

        function setupTelemetry(sourceId = 'local_webcam') {
            if (telemetryWS) {
                telemetryWS.close();
            }

            const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
            // UPDATED: Point to the new tiered WEB metadata endpoint
            telemetryWS = new WebSocket(`${protocol}//${location.host}/api/web/ws/${sourceId}`);
            
            telemetryWS.onopen = () => {
                document.getElementById('ws-indicator').style.background = 'var(--success)';
                document.getElementById('ws-indicator').style.boxShadow = '0 0 10px var(--success)';
            };
            
            telemetryWS.onclose = () => {
                document.getElementById('ws-indicator').style.background = 'var(--danger)';
                document.getElementById('ws-indicator').style.boxShadow = '0 0 10px var(--danger)';
            };
            
            telemetryWS.onmessage = (e) => {
                window.dispatchEvent(new CustomEvent('telemetryUpdate', { detail: JSON.parse(e.data) }));
            };
        }

        function startWatchdog() {
            const feed = document.querySelector('img.live-feed');
            if (feed) {
                setInterval(() => {
                    const url = new URL(feed.src, location.href);
                    url.searchParams.set('t', Date.now());
                }, 5000);
            }
        }

        // Initial connection to the default local webcam slot
        setupTelemetry('local_webcam');
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
